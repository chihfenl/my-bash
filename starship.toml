# Starship prompt — the old-bash look, enhanced with contextual modules.
#   bold green  user@host
#   bold red    working directory (full path)
#   git (branch) + dirty / ahead-behind, language versions, exit code.
# Contextual modules appear ONLY when relevant, so plain dirs stay minimal.
#
# Some symbols are Nerd Font glyphs — set your terminal font to a Nerd Font
# (e.g. "FiraCode Nerd Font") or they'll show as boxes. The base prompt
# (user@host, path, branch, *) works in any font.
#
# Shared by both ~/.bashrc and ~/.zshrc.

add_newline = true

format = """
$username$hostname $directory$git_branch$git_status$python$java$scala
$status$character"""

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold green"
format = "[@$hostname]($style)"

[directory]
style = "bold red"
truncation_length = 0      # 0 = show the full path, like bash \w
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
symbol = ""              # no glyph — keep the plain (branch) look
style = ""               # default terminal color, like the old `$git_branch`
format = "[\\($symbol$branch\\)]($style)"   # (branch) in parens, like the old prompt

[git_status]
style = "bold blue"      # like the old bold-blue `$git_dirty`
modified = "*"           # unstaged changes, like the old `*`
staged = "^"             # staged-only changes, like the old `^`
stashed = "≡"            # something stashed
conflicted = "="         # merge conflicts
ahead = "⇡${count}"      # commits ahead of upstream
behind = "⇣${count}"     # commits behind upstream
diverged = "⇡${ahead_count}⇣${behind_count}"
format = "([$conflicted$stashed$modified$staged$ahead_behind]($style))"

# --- Contextual language versions (only inside a matching project) ---
[python]
symbol = " "
style = "bold yellow"
format = 'via [$symbol$version( \($virtualenv\))]($style) '
pyenv_version_name = true   # read pyenv version name (faster than launching python)
detect_extensions = []      # don't trigger on a stray loose .py file — only on a
                            # real project (pyproject.toml/requirements.txt/setup.py/
                            # Pipfile/tox.ini/.python-version/__init__.py) or active venv

[java]
symbol = " "
style = "bold red"
format = 'via [$symbol$version]($style) '

[scala]
symbol = " "
style = "bold red"
format = 'via [$symbol$version]($style) '


# --- Last command's exit code (only shown on failure) ---
[status]
disabled = false
symbol = "✘ "
style = "bold red"
format = '[$symbol$status]($style) '

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
